<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhatsNotify — Monitor</title><style>:root{color-scheme:dark;--bg:#0b0f14;--panel:#121821;--line:#263140;--text:#e7edf4;--muted:#94a3b8;--ok:#36c98f;--warn:#f5b942;--bad:#ef6262}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1320px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}h1{font-size:22px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.section{margin-bottom:16px}.k{font-size:12px;color:var(--muted);margin-bottom:5px}.v{font-size:18px;font-weight:650;word-break:break-word}.status{display:inline-flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.ok .dot{background:var(--ok)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}tr:last-child td{border-bottom:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.err{color:var(--bad);word-break:break-word}button{background:#1d4ed8;color:white;border:0;border-radius:7px;padding:8px 12px;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{display:block}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>WhatsNotify</h1><div class="sub">Monitor administrativo</div></div><div id="poll" class="sub">Carregando…</div></div><div class="grid" id="cards"></div><div class="section"><h2>WhatsApp</h2><div id="wa"></div></div><div class="section"><h2>Senders</h2><div id="senders"></div></div><div class="section"><h2>Automações</h2><div id="automations"></div></div><div class="section"><h2>Atualização</h2><div id="update"></div></div></div><script>const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';const dur=s=>{s=Number(s||0);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return `${d}d ${h}h ${m}m`};const short=s=>s?String(s).slice(0,7):'—';const cls=s=>['online','connected','synced','ok','active','success','up_to_date'].includes(String(s).toLowerCase())?'ok':['degraded','starting','authenticated','idle','awaiting_qr','checking','unknown'].includes(String(s).toLowerCase())?'warn':'bad';const pill=s=>`<span class="status ${cls(s)}"><span class="dot"></span>${esc(s)}</span>`;const table=(heads,rows)=>`<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;async function triggerUpdate(){const b=document.getElementById('updateNow');if(b)b.disabled=true;try{const r=await fetch('/api/update',{method:'POST',headers:{'X-Requested-With':'WhatsNotifyDashboard'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);alert('Atualização iniciada.')}catch(e){alert(`Falha ao iniciar atualização: ${e.message}`)}finally{if(b)b.disabled=false}}async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();document.getElementById('cards').innerHTML=`<div class="card"><div class="k">Serviço</div><div class="v">${pill(d.service.status)}</div><div class="muted">uptime ${dur(d.service.uptime)}</div></div><div class="card"><div class="k">Aplicação / Web cache</div><div class="v">v${esc(d.service.version)}</div><div class="mono muted">${esc(d.webVersionCache.activeVersion||d.webVersionCache.requestedVersion||'latest')} · ${d.webVersionCache.present?'local':'bootstrap'}</div></div><div class="card"><div class="k">NTP</div><div class="v">${pill(d.time.ntpStatus)}</div><div class="muted">offset ${esc(d.time.offsetMs)} ms · ${esc(d.time.server)}</div></div><div class="card"><div class="k">Agora</div><div class="v">${fmt(d.time.current)}</div><div class="muted">${esc(d.time.timezone)}</div></div>`;const w=d.whatsapp;document.getElementById('wa').innerHTML=table(['Configurado','Estado','Sessão','Última conexão','Último erro'],[`<tr><td>${w.configured?'Sim':'Não'}</td><td>${pill(w.status)}</td><td class="mono">${esc(w.sessionId)}</td><td>${fmt(w.lastConnection)}</td><td class="err">${esc(w.lastError)}</td></tr>`]);document.getElementById('senders').innerHTML=table(['Nome','Tipo','Ativo','Status','Conexão','Último uso'],d.senders.map(s=>`<tr><td>${esc(s.name)}<div class="mono muted">${esc(s.id)}</div></td><td>${esc(s.type)}</td><td>${s.active?'Sim':'Não'}</td><td>${pill(s.status)}</td><td>${esc(s.connectionState)}</td><td>${fmt(s.lastUsedAt)}</td></tr>`));document.getElementById('automations').innerHTML=table(['Nome','Ativa','Status','Agenda','Última execução','Próxima','Falhas','Último erro'],d.automations.map(a=>`<tr><td>${esc(a.name)}<div class="mono muted">${esc(a.id)}</div></td><td>${a.active?'Sim':'Não'}</td><td>${pill(a.status)}</td><td class="mono">${esc(a.schedule)}</td><td>${fmt(a.lastExecution)}</td><td>${fmt(a.nextExecution)}</td><td>${esc(a.failures)}</td><td class="err">${esc(a.lastError)}</td></tr>`));const u=d.update||{};document.getElementById('update').innerHTML=table(['Repositório','Branch','Instalado','Disponível','Status','Auto update','Última verificação','Última atualização','Ação'],[`<tr><td>${esc(u.repository)}</td><td class="mono">${esc(u.branch)}</td><td class="mono">${short(u.installedCommit)}</td><td class="mono">${short(u.latestCommit)}</td><td>${pill(u.updateAvailable?'update_available':u.lastStatus)}</td><td>${u.autoUpdateEnabled?'Ativo':'Inativo'}</td><td>${fmt(u.lastCheck)}</td><td>${fmt(u.lastUpdate)}</td><td>${u.allowManualUpdate?'<button id="updateNow" onclick="triggerUpdate()">Atualizar agora</button>':'Desabilitado'}</td></tr>`]);document.getElementById('poll').textContent=`Atualizado ${new Date().toLocaleTimeString('pt-BR')}`}catch(e){document.getElementById('poll').innerHTML=`<span class="status bad"><span class="dot"></span>Offline / ${esc(e.message)}</span>`}}refresh();setInterval(refresh,5000);</script></body></html>
